# Les Gracieux — configuration Netlify
# -----------------------------------------------------------------------
# Le site est 100% statique (pas de build habituellement nécessaire).
# La seule chose que cette commande fait : régénérer build-info.js avec
# la date réelle de CE déploiement, pour que le pied de page
# "Dernière mise à jour" du site reflète la vraie date de mise en ligne
# plutôt que la date du jour où quelqu'un consulte le site.
#
# Ne pas modifier build-info.js à la main : il est réécrit à chaque
# déploiement par la ligne ci-dessous.

[build]
  command = "echo \"window.BUILD_DATE = '$(date -u +%Y-%m-%d)';\" > build-info.js"
  publish = "."

# Compteur de "j'aime" des commentaires (netlify/functions/like-comment.js) :
# petit bout de code serveur, seule partie du site qui n'est pas 100%
# statique. Utilise Netlify Blobs (stockage inclus chez Netlify, rien à
# configurer côté compte).
[functions]
  directory = "netlify/functions"

# Unification des URL : permet d'accéder à chaque page avec ou sans
# l'extension .html (ex. /videos affiche le même contenu que
# /videos.html), sans jamais toucher aux liens internes existants du
# site (qui continuent tous à utiliser .html normalement). status = 200
# signifie "servir ce fichier sans changer l'URL affichée" (pas une
# redirection visible, donc aucun risque de casser un lien).
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/art"
  to = "/art.html"
  status = 200

